<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>AIMS console</title>
<style>
@font-face { font-family: "Latin Modern Roman"; font-weight: 400; font-style: normal; font-display: swap; src: url(fonts/lmroman10-regular.woff2) format("woff2"); }
body { margin: 0; background: #fff; color: #22222A; font: 18px/1.5 'CMU Serif', 'Latin Modern Roman', 'Computer Modern Serif', Georgia, serif; min-height: 100vh; display: grid; place-items: center; -webkit-font-smoothing: antialiased; }
main { width: min(440px, calc(100% - 48px)); padding: 36px 0; }
.home { color: #56648A; font-size: 15px; text-decoration: none; display: block; margin-bottom: 18px; }
.home:hover { color: #8F3B1E; }
h1 { font-size: 40px; font-weight: 400; color: #1A2A4A; line-height: 1.08; margin: 0 0 10px; }
p { margin: 10px 0 22px; }
label { display: block; margin-bottom: 8px; color: #5A5C6B; font-size: 16px; }
input, button { font: inherit; box-sizing: border-box; width: 100%; padding: 10px 12px; border: 2px solid #22222A; border-radius: 0; background: #fff; color: #22222A; }
button { background: #1A2A4A; color: #fff; border-color: #1A2A4A; margin-top: 14px; cursor: pointer; }
button:hover { background: #22222A; border-color: #22222A; }
button:disabled { opacity: 0.5; cursor: default; }
input:focus-visible, button:focus-visible { outline: 2px solid #8F3B1E; outline-offset: 2px; }
#unlock-message { min-height: 1.5em; color: #5A5C6B; font-size: 16px; margin: 12px 0 0; }
</style>
</head>
<body>
<main>
  <a class="home" href="/">leonmgarcia.com</a>
  <h1>AIMS console</h1>
  <p>Private copy for the AIMS team. It replays recorded simulator runs; no instrument is attached.</p>
  <form id="aims-unlock">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Open</button>
  </form>
  <p id="unlock-message" role="status"></p>
</main>
<script src="access.js"></script>
</body>
</html>
